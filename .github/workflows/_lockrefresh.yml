name: lockrefresh
on:
  push:
    branches: ["fix/315-audit-deps"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/315-audit-deps
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate the lock for the bumped direct deps
        # --precise because the lock carries more than one quick-xml / zip
        # entry, and a bare -p is ambiguous there. zip and quick-xml are NOT
        # touched directly: calamine 0.38 and rust_xlsxwriter 0.102 both
        # accept the zip 9.0.5 already in the lock, and calamine pulls its own
        # quick-xml 0.42 alongside docx-rs's 0.41.
        run: |
          cargo update -p calamine --precise 0.38.0
          cargo update -p rust_xlsxwriter --precise 0.102.0
          cargo update -p pulldown-cmark --precise 0.13.6
      - name: Show what moved
        run: |
          git diff --stat Cargo.lock || true
      - name: Push the lock back
        run: |
          git config user.name "lockrefresh"
          git config user.email "lockrefresh@users.noreply.github.com"
          if git diff --quiet Cargo.lock; then echo "lock already current"; exit 0; fi
          git add Cargo.lock
          git commit -m "chore(deps): regenerasi Cargo.lock untuk calamine 0.38 / rust_xlsxwriter 0.102 / pulldown-cmark 0.13.6 (#315)"
          git push origin HEAD:fix/315-audit-deps
