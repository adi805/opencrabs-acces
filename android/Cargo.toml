[package]
name = "oc-gui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib is what GameActivity dlopen()s; the lib target keeps rust-analyzer sane.
crate-type = ["cdylib", "lib"]

[dependencies]
# glow (OpenGL ES) rather than wgpu: the CI emulator renders with swiftshader,
# which exposes GLES reliably and Vulkan only partially.
eframe = { version = "0.36", default-features = false, features = [
  "default_fonts",
  "glow",
  "android-game-activity",
] }
android_logger = "0.15"
log = "0.4"
# The android-game-activity feature is what switches android-activity from the
# native_activity glue (text_input_state = NOP) to the GameActivity glue
# (real GameTextInput bridge). Keep it on our own dependency too so feature
# unification cannot silently drop it.
# x11/wayland bukan buat Android: itu backend host, supaya `cargo check` di
# target host (AC task 2) tidak kena compile_error winit
# (winit-0.30.13/src/platform_impl/mod.rs:78). Feature winit di-gate per
# target, jadi di Android keduanya diabaikan.
winit = { version = "0.30", default-features = false, features = [
  "android-game-activity",
  "x11",
  "wayland",
] }
# android-activity WAJIB target-specific: crate ini menarik ndk-sys yang
# menolak compile di host (ndk-sys/src/lib.rs:22 "only supports compiling for
# Android"), jadi host cargo check gagal kalau dia global.
# Pin =0.6.0 harus tetap di dalam blok dependencies (key setelah header tabel
# diabaikan cargo -- bug itu yang bikin 0.6.1 kepakai di run 45593951071).
# 0.6.0 vendors AGDK yang tabel RegisterNatives-nya cocok dengan AAR Java yang
# kita pin (games-activity 2.0.2, onTouchEventNative 3-arg). 0.6.1 bawa AGDK
# lebih baru dengan onTouchEventNative 17-arg -> RegisterNatives gagal ->
# SIGABRT saat load. Bukti: 0.6.0/GameActivity.cpp:974 vs 0.6.1:1142.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = "=0.6.0"

# Vendored android-activity 0.6.0 with a null-guard fix in the GameTextInput
# callback (upstream 0.6.0 AND 0.6.1 both panic on the initial empty state:
# slice::from_raw_parts(null, 0)). See vendor/android-activity/README-OC.md.
[patch.crates-io]
android-activity = { path = "vendor/android-activity" }

# Debug APK: strip symbols so the per-ABI .so stays well under the 50 MB
# Telegram bot upload limit (unstripped debug cdylib is ~141 MB).
[profile.dev]
strip = "symbols"

# Standalone workspace root: this crate is NOT a member of the main
# opencrabs workspace (different lockfile, mobile-only deps).
[workspace]
